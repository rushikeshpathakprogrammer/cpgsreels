name: Generate voice (Sarvam)
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job file in jobs/ (without .json)"
        required: true
permissions:
  contents: write
concurrency: { group: tts, cancel-in-progress: false }
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Generate audio
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: python engine/tts.py "jobs/${{ inputs.job }}.json"
      - name: Commit audio
        if: always()
        run: |
          git config user.name "reels-bot"; git config user.email "reels-bot@users.noreply.github.com"
          git add audio || true
          git commit -m "voice: ${{ inputs.job }}" || echo "nothing to commit"
          git pull --rebase && git push
